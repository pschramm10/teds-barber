<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ted's Barber — Staff</title>
<meta name="theme-color" content="#f7f4ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main>

  <!-- LOGIN -->
  <div id="login-view">
    <div class="card login-card">
      <h2>Staff Sign-In</h2>
      <p class="login-sub">Enter your password to access the schedule.</p>
      <form id="login-form" class="book-form">
        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input type="password" id="password" required autofocus>
        </div>
        <button type="submit" class="primary-btn">
          Enter
          <span class="arrow">→</span>
        </button>
        <p class="form-msg" id="login-msg"></p>
      </form>
    </div>
    <p style="text-align:center; margin-top:1.25rem; font-size:0.85rem;">
      <a href="index.html" class="admin-link">← Back to booking</a>
    </p>
  </div>

  <!-- DASHBOARD -->
  <div id="dash-view" class="hidden">
    <div class="admin-header">
      <h1>Schedule</h1>
      <div class="header-actions">
        <button class="secondary-btn" id="refresh-btn">Refresh</button>
        <button class="secondary-btn" id="logout-btn">Sign out</button>
      </div>
    </div>

    <div class="admin-grid">

      <div class="admin-section">
        <h3>Block off time</h3>
        <p class="section-sub">Mark a slot or whole day as unavailable.</p>
        <div class="block-controls">
          <div class="field">
            <label class="field-label" for="block-date">Date</label>
            <input type="date" id="block-date">
          </div>
          <div class="field">
            <label class="field-label" for="block-time">Time</label>
            <select id="block-time">
              <option value="">— Select a time —</option>
              <option value="13:30">1:30 PM</option>
              <option value="14:00">2:00 PM</option>
              <option value="14:30">2:30 PM</option>
              <option value="15:00">3:00 PM</option>
              <option value="15:30">3:30 PM</option>
              <option value="16:00">4:00 PM</option>
              <option value="16:30">4:30 PM</option>
              <option value="17:00">5:00 PM</option>
            </select>
          </div>
          <div class="btn-row">
            <button class="primary-btn" id="block-slot-btn">Block slot</button>
            <button class="secondary-btn" id="block-day-btn">Block whole day</button>
          </div>
          <p class="form-msg" id="block-msg"></p>
        </div>
      </div>

      <div class="admin-section">
        <h3>Upcoming</h3>
        <p class="section-sub">All bookings and blocked slots from today onward.</p>
        <div class="admin-list" id="admin-list">
          <p class="empty-state"><span class="spinner"></span> Loading…</p>
        </div>
      </div>

    </div>
  </div>

</main>

<script src="admin.js"></script>
</body>
</html>
